# Lavalink configuration
#
# SECRETS ARE PULLED FROM ENVIRONMENT VARIABLES — set these in Render's
# dashboard (Environment tab), not in this file:
#   LAVALINK_PASSWORD       -> lavalink.server.password
#   YOUTUBE_REFRESH_TOKEN   -> plugins.youtube.oauth.refreshToken
#   YOUTUBE_SKIP_OAUTH_INIT -> plugins.youtube.oauth.skipInitialization
#
# First deploy: leave YOUTUBE_REFRESH_TOKEN unset and
# YOUTUBE_SKIP_OAUTH_INIT=false, watch the Render logs for the OAuth URL,
# complete verification with a burner Google account, copy the refresh
# token from the logs, then set YOUTUBE_REFRESH_TOKEN and
# YOUTUBE_SKIP_OAUTH_INIT=true and redeploy.

lavalink:
  plugins:
    # Was pinned to an unreleased snapshot commit; moved to the current stable
    # release, which includes newer fixes for the YouTube SABR/403 breakage.
    # Check https://github.com/lavalink-devs/youtube-source/releases for anything newer.
    - dependency: dev.lavalink.youtube:youtube-plugin:1.8.3
      repository: https://maven.lavalink.dev/releases
      snapshot: false
    - dependency: com.github.xylen-py.SlugYZeon:slugyzeon-plugin:4.4.7
      repository: https://jitpack.io
    - dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.3
      repository: https://maven.lavalink.dev/releases
      snapshot: false
    - dependency: com.github.topi314.lavasearch:lavasearch-plugin:1.0.0
      repository: https://maven.lavalink.dev/releases
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD}
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    gc-warnings: true
    opusEncodingQuality: 10
    playerUpdateInterval: 5
    resamplingQuality: HIGH
    soundcloudSearchEnabled: true
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: true

    filters:
      channelMix: true
      distortion: true
      equalizer: true
      karaoke: true
      lowPass: true
      rotation: true
      timescale: true
      tremolo: true
      vibrato: true
      volume: true

    sources:
      bandcamp: true
      http: true
      local: false
      nico: true
      soundcloud: true
      twitch: true
      vimeo: true
      youtube: false

    timeouts:
      connectTimeoutMs: 60000
      connectionRequestTimeoutMs: 60000
      socketTimeoutMs: 60000

logging:
  file:
    path: ./logs/

  level:
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    lavalink: INFO
    root: INFO

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includePayload: true
    includeQueryString: true
    maxPayloadLength: 10000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

plugins:
  lavasearch:
    sources:
      - spotify
      - youtube

  slugyzeon:
    providers:
      - "ytsearch:%ISRC%"
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      gaana: false
      amazonmusic: true
      pandora: true
      spotify: true

    spotify:
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false

    amazonmusic:
      apiUrl: "https://amazon-plugin-api.vercel.app/api"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50

  lavasrc:
    providers:
      - ytsearch:"%ISRC%"
      - ytsearch:%QUERY%
    sources:
      applemusic: false
      deezer: false
      flowerytts: false
      spotify: false
      yandexmusic: false
      youtube: true

    spotify:
      albumLoadLimit: 10
      clientId:
      clientSecret:
      countryCode: US
      customTokenEndpoint: null
      localFiles: false
      playlistLoadLimit: 10
      preferPartnerApi: false
      preferV1SearchApi: false
      resolveArtistsInSearch: false
      spDc: null

  youtube:
    allowDirectPlaylistIds: true
    allowDirectVideoIds: true
    allowSearch: true
    clients:
      - WEB
      - TV
      - ANDROID_VR
    enabled: true

    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:}
      skipInitialization: ${YOUTUBE_SKIP_OAUTH_INIT:false}

    remoteCipher:
      url: https://cipher.kikkia.dev/
      userAgent: lavalink-server

sentry:
  dsn: ""
  environment: ""

server:
  address: 0.0.0.0
  http2:
    enabled: false
  port: ${SERVER_PORT:80}
